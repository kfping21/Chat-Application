openapi: 3.0.0
info:
  title: Treehole Chat API
  version: 1.0.0
  description: |
    面向树洞聊天业务的作业接口（认证 + 帖子 CRUD + 分页筛选）。
    使用前请先配置 backend/.env 中 DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME，
    并确保数据库已执行 backend/sql/init.sql。
servers:
  - url: http://localhost:3000
paths:
  /api/auth/register:
    post:
      summary: 注册用户（映射到 users）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                displayName: { type: string }
      responses:
        '201':
          description: 注册成功
        '400':
          description: 参数错误
  /api/auth/login:
    post:
      summary: 登录（使用注册后的用户名和密码）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 登录成功
        '401':
          description: 认证失败
  /api/auth/logout:
    post:
      summary: 登出
      security:
        - bearerAuth: []
      responses:
        '200': { description: 成功 }
        '401': { description: 未授权 }
  /api/posts:
    get:
      summary: 获取公开帖子列表（分页 + 筛选）
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1, minimum: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
        - in: query
          name: emotionCode
          schema: { type: string }
      responses:
        '200': { description: 成功 }
    post:
      summary: 创建帖子
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, emotionCode]
              properties:
                content: { type: string, maxLength: 500 }
                emotionCode: { type: string }
                allowComments: { type: boolean }
                isPublic: { type: boolean }
      responses:
        '201': { description: 创建成功 }
        '400': { description: 参数错误 }
        '401': { description: 未授权 }
  /api/posts/{id}:
    get:
      summary: 获取单个帖子
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 成功 }
        '404': { description: 不存在 }
    put:
      summary: 更新帖子（仅作者）
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, maxLength: 500 }
                emotionCode: { type: string }
                allowComments: { type: boolean }
                isPublic: { type: boolean }
      responses:
        '200': { description: 更新成功 }
        '400': { description: 参数错误 }
        '401': { description: 未授权 }
        '404': { description: 不存在或无权限 }
    delete:
      summary: 删除帖子（仅作者）
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 删除成功 }
        '401': { description: 未授权 }
        '404': { description: 不存在或无权限 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
