name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Run backend tests
        working-directory: ./backend
        run: npm test -- --coverage --ci || echo "No tests configured"

      - name: Upload coverage
        if: always()
        working-directory: ./backend
        run: |
          if [ -f coverage/lcov.info ]; then
            npx codecov --token=${CODECOV_TOKEN} --flags=backend --repo https://github.com/kfping21/Chat-Application || true
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android project
        working-directory: ./app
        run: ./gradlew assembleDebug --no-daemon

      - name: Run lint
        working-directory: ./app
        run: ./gradlew lint --no-daemon

      - name: Run tests
        working-directory: ./app
        run: ./gradlew test --no-daemon

      - name: Upload coverage
        working-directory: ./app
        run: |
          if [ -f app/build/reports/coverage/debug/coverage.xml ]; then
            npx codecov --token=${CODECOV_TOKEN} --flags=frontend --files=app/build/reports/coverage/debug/coverage.xml --repo https://github.com/kfping21/Chat-Application || true
          elif [ -f build/outputs/code-coverage/coverage.ec ]; then
            npx codecov --token=${CODECOV_TOKEN} --flags=frontend --files=build/outputs/code-coverage/coverage.ec --repo https://github.com/kfping21/Chat-Application || true
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: app/build/outputs/apk/debug/*.apk