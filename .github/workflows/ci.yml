name: CI

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check backend structure
        working-directory: ./backend
        run: |
          ls -la
          if [ -f package.json ]; then
            npm install
            npm test -- --coverage --ci
          else
            echo "Backend package.json not found, skipping tests"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        working-directory: ./frontend/前端代码
        run: chmod +x gradlew

      - name: Build Android project
        working-directory: ./frontend/前端代码
        run: ./gradlew assembleDebug --no-daemon 2>&1 || true

      - name: Run lint
        working-directory: ./frontend/前端代码
        run: ./gradlew lintDebug --no-daemon 2>&1 || true

      - name: Run tests
        working-directory: ./frontend/前端代码
        run: ./gradlew testDebugUnitTest --no-daemon 2>&1 || true