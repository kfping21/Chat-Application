name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Lint backend
        run: |
          if npm --prefix backend run | grep -q " lint"; then
            npm run lint --prefix backend
          else
            echo "No backend lint script found, skipping backend lint."
          fi

      - name: Run backend tests
        run: |
          if npm --prefix backend run | grep -q " test"; then
            npm test --prefix backend
          else
            echo "No test script found, skipping backend tests."
          fi

      - name: Generate backend coverage
        run: |
          if npm --prefix backend run | grep -q " test:coverage:ci"; then
            npm run test:coverage:ci --prefix backend
          else
            echo "No coverage script found, skipping coverage."
          fi

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend project
        id: frontend_check
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package.json found, skipping frontend checks."
          fi

      - uses: actions/setup-node@v4
        if: steps.frontend_check.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.frontend_check.outputs.exists == 'true'
        run: npm ci --prefix frontend

      - name: Lint frontend
        if: steps.frontend_check.outputs.exists == 'true'
        run: npm run lint --prefix frontend

      - name: Run frontend tests
        if: steps.frontend_check.outputs.exists == 'true'
        run: npm test --prefix frontend -- --coverage --ci

      - name: Upload frontend coverage
        if: steps.frontend_check.outputs.exists == 'true'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
